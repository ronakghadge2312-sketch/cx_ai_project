<!DOCTYPE html>
<html>
<head>
  <title>Flat Tab Forms</title>
</head>

<body background="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80">

  <br><br>

  <center>
    <font face="Arial, sans-serif" color="white" size="7">
      <b>Flat Tab Forms</b>
    </font>
  </center>

  <br><br>

  <table align="center" width="400" bgcolor="rgba(255, 255, 255, 0.2)" cellpadding="0" cellspacing="0">
    
    <tr>
      <td width="50%" bgcolor="#3d306b" align="center" height="45">
        <font face="Arial, sans-serif" color="white" size="3">
          <b>Sign In</b>
        </font>
      </td>
      <td width="50%" bgcolor="#a8a3c1" align="center" height="45">
        <font face="Arial, sans-serif" color="white" size="3">
          <b>Sign Up</b>
        </font>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <table width="100%" cellpadding="20" cellspacing="0">
          <tr>
            <td>
              <form>
                
                <font face="Arial, sans-serif" color="white" size="2">
                  <b>Email</b>
                </font>
                <br><br>
                <input type="email" placeholder="Johnsmith@gmail.com" style="width: 95%; padding: 10px; border: none; border-radius: 3px;">
                
                <br><br>

                <font face="Arial, sans-serif" color="white" size="2">
                  <b>Password</b>
                </font>
                <br><br>
                <input type="password" placeholder="Password" style="width: 95%; padding: 10px; border: none; border-radius: 3px;">

                <br><br>

                <input type="checkbox" id="remember" checked>
                <font face="Arial, sans-serif" color="white" size="2">
                  <label for="remember">Remember me</label>
                </font>

                <br><br>

                <input type="submit" value="Sign In" style="width: 100%; padding: 12px; background-color: #3d306b; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 3px;">

                <br><br>

                <center>
                  <font face="Arial, sans-serif" size="2">
                    <a href="#" style="color: white; text-decoration: none;">Forgot Your Password?</a>
                  </font>
                </center>

                <br><br>

                <table width="100%" cellspacing="5">
                  <tr>
                    <td width="50%" bgcolor="#4297d7" align="center" height="35">
                      <a href="#" style="color: white; text-decoration: none; font-family: Arial, sans-serif; font-size: 12px;">
                        <b>Sign In with Twitter</b>
                      </a>
                    </td>
                    <td width="50%" bgcolor="#3b5998" align="center" height="35">
                      <a href="#" style="color: white; text-decoration: none; font-family: Arial, sans-serif; font-size: 12px;">
                        <b>Sign In with Facebook</b>
                      </a>
                    </td>
                  </tr>
                </table>

              </form>
            </td>
          </tr>
        </table>
      </td>
    </tr>

  </table>

  <br><br>

  <center>
    <font face="Arial, sans-serif" color="white" size="4"><b>×</b></font>
    <br><br>
    <font face="Arial, sans-serif" color="white" size="2">
      © 2016 Flat Tab Forms. All Rights Reserved | Design by W3layouts
    </font>
  </center>

</body>
</html>
